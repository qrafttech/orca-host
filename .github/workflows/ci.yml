# Lint, build, smoke-test, push. Every push gets a multi-arch image tagged with its branch and its sha; main
# also gets `main`. Pinning a host to a build = its sha tag in terraform.tfvars.
name: ci
on:
  push: # branches only: a PR from this repository is already covered by its branch's push

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - run: shellcheck entrypoint.sh prune-stacks.sh empty-trash.sh inject-env.sh
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check -diff
      - run: terraform -chdir=terraform init -backend=false && terraform -chdir=terraform validate

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
      # amd64 first, loaded locally: the smoke test runs it before anything is pushed
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test — the ready contract, as upstream tests it, a deleted worktree's stack torn down, its trash emptied
        run: |
          # a compose stack started from a directory under /home/orca that no longer exists, one of its images built by
          # compose: gone, image included, once the server is up
          sudo install -d -o "$USER" /home/orca/ghost
          printf 'services:\n  s: {build: {context: ., dockerfile_inline: "FROM alpine:3.20\\nRUN touch /built"}, command: sleep infinity, stop_grace_period: 1s, volumes: [data:/data]}\nvolumes:\n  data:\n' > /home/orca/ghost/compose.yaml
          # with the image's compose, as from an Orca terminal: it labels the images it builds with their project, which
          # is how `down --rmi local` finds them with no compose file
          docker run --rm --entrypoint docker -v /var/run/docker.sock:/var/run/docker.sock -v /home/orca:/home/orca ${{ env.IMAGE }}:smoke \
            compose -f /home/orca/ghost/compose.yaml up -d --build && sudo rm -rf /home/orca/ghost
          # a worktree in Orca's trash, root-owned as a project's containers leave it, next to a directory that is not one
          trash=/home/orca/orca/workspaces/p/.orca-worktree-trash
          sudo install -d "$trash/wt-1-a/node_modules" "$trash/keep" && sudo touch "$trash/wt-1-a/node_modules/x"
          docker run -d --name smoke -e PAIRING_ADDRESS=127.0.0.1 -v /var/run/docker.sock:/var/run/docker.sock -v /home/orca:/home/orca ${{ env.IMAGE }}:smoke
          for i in $(seq 1 24); do
            sleep 5
            if docker logs smoke 2>/dev/null | jq -Rr 'fromjson? | select(.type=="orca_server_ready" and .schemaVersion==1) | .type' | grep -q .; then
              echo "ready after $((i*5))s"; docker exec -u orca smoke docker version --format 'docker {{.Server.Version}} from the container'
              docker logs smoke 2>&1 | grep '^prune-stacks: ghost torn down'
              left=$(docker ps -a --filter label=com.docker.compose.project=ghost --format '{{.Names}}'; docker volume ls --filter label=com.docker.compose.project=ghost --format '{{.Name}}'; docker image ls -q ghost-s)
              [ -z "$left" ] || { echo "ghost stack left behind: $left"; exit 1; }
              docker logs smoke 2>&1 | grep "^empty-trash: $trash/wt-1-a removed"
              [ ! -e "$trash/wt-1-a" ] || { echo "trashed worktree left behind"; exit 1; }
              [ -d "$trash/keep" ] || { echo "empty-trash removed what is not a worktree"; exit 1; }
              exit 0
            fi
          done
          docker logs smoke; exit 1
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
